<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#111"/>
  <!-- Scissors: two blades crossing at center -->
  <!-- Top-left blade -->
  <line x1="6" y1="6" x2="18" y2="18" stroke="#c9a84c" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bottom-left blade -->
  <line x1="6" y1="26" x2="18" y2="18" stroke="#c9a84c" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right handle extension -->
  <line x1="18" y1="18" x2="27" y2="14" stroke="#c9a84c" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="18" y1="18" x2="27" y2="22" stroke="#c9a84c" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pivot screw -->
  <circle cx="18" cy="18" r="2" fill="#c9a84c"/>
  <!-- Handle rings -->
  <circle cx="7" cy="6" r="3" stroke="#c9a84c" stroke-width="1.8" fill="none"/>
  <circle cx="7" cy="26" r="3" stroke="#c9a84c" stroke-width="1.8" fill="none"/>
</svg>
